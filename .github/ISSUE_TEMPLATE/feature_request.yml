name: Feature request
description: Suggest a new feature or a change to the API.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Chinese, Japanese and Korean scripts ([FAQ](https://github.com/AbhiCodebugger/live_translate#faq)) and rotated text are already planned. A thumbs-up on an existing issue helps prioritise it.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or use case, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from your app's side. Code sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
      description: Workarounds, for example with `overlayBuilder` or the controller, and why they fall short.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this, following CONTRIBUTING.md.
