name: live_translate
description: >-
  A drop-in Flutter widget for live, offline camera translation. Recognises
  text in the camera view, translates it on-device and paints it in place.
version: 0.2.1
repository: https://github.com/AbhiCodebugger/live_translate
issue_tracker: https://github.com/AbhiCodebugger/live_translate/issues
topics:
  - camera
  - translation
  - ocr
  - mlkit
  - machine-learning

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  google_mlkit_language_id: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1
  meta: ^1.16.0

dev_dependencies:
  camera_platform_interface: ^2.14.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
